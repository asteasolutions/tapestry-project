services:
  client:
    build:
      dockerfile: ./Dockerfile.client
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_AUTH_PROVIDERS: google
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
        VITE_ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
        VITE_ORCID_BASE_URL: ${ORCID_BASE_URL}
        VITE_WIKIMEDIA_CLIENT_ID: ${WIKIMEDIA_CLIENT_ID}
        VITE_WIKIMEDIA_BASE_URL: ${WIKIMEDIA_BASE_URL}
        VITE_BUG_REPORT_FORM_URL: ${BUG_REPORT_FORM_URL}
        VITE_AI_CHAT_EXPIRES_IN: ${AI_CHAT_EXPIRES_IN}
        VITE_WEBPAGE_LOADER_TIMEOUT: ${WEBPAGE_LOADER_TIMEOUT}
        VITE_STUN_SERVER: ${STUN_SERVER}
    ports:
      - "8080:80"

  server:
    build:
      dockerfile: ./Dockerfile.server
      target: server
    environment: &server_env
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_USE_SSL: ${DB_USE_SSL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?schema=public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
      ORCID_BASE_URL: ${ORCID_BASE_URL}
      WIKIMEDIA_CLIENT_ID: ${WIKIMEDIA_CLIENT_ID}
      WIKIMEDIA_CLIENT_SECRET: ${WIKIMEDIA_CLIENT_SECRET}
      WIKIMEDIA_BASE_URL: ${WIKIMEDIA_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE}
      REDIS_HOST: redis
      EXTERNAL_SERVER_URL: ${EXTERNAL_SERVER_URL}
      VIEWER_URL: ${VIEWER_URL}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
    ports:
      - 3000:3000
    depends_on:
      - db
      - redis

  worker:
    build:
      dockerfile: ./Dockerfile.server
      target: worker
    init: true
    environment:
      <<: *server_env
      PUPPETEER_ARGS: "--no-sandbox,--disable-dev-shm-usage"
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    # `mini` runs master, volume, filer and S3 gateway in a single process.
    # The admin identity is created from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
    command: mini -dir=/data -admin.allowInsecureBind
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${S3_PORT:-8333}:8333"
      - "${S3_ADMIN_UI_PORT:-12535}:12535"
    volumes:
      - s3data:/data

  s3-init:
    image: amazon/aws-cli:2.27.0
    entrypoint: ["/scripts/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    volumes:
      - ./deployment/s3:/scripts:ro
    depends_on:
      - seaweedfs
    restart: "no"

  vault:
    image: hashicorp/vault
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      ROLE_ID: ${VAULT_ROLE_ID}
      SECRET_ID: ${VAULT_SECRET_ID}
    volumes:
      - ./deployment/vault:/scripts
    cap_add:
      - IPC_LOCK
    command: ["/scripts/start-dev.sh"]

volumes:
  pgdata:
  s3data:
